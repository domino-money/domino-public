[Unit]
PartOf=domino-public-data.target

[Timer]
# One empty assignment resets every trigger, the unit's own included, and what
# follows it is the whole list (systemd.timer(5)). An empty OnUnitActiveSec=
# placed after OnBootSec=30s and OnActiveSec=30s erased both: systemd loaded
# only OnUnitInactiveSec=60s, which never fires after a reboot because the
# service has not run yet. Both timers stopped from the 23 Sep and the 30 Sep
# 2026 reboots until someone started the service by hand (#278).
OnBootSec=
# Every minute by the wall clock: a calendar trigger always has a next
# elapse, whatever happened to the last run or to the timer's activations.
OnCalendar=minutely
AccuracySec=1s
RandomizedDelaySec=2s
