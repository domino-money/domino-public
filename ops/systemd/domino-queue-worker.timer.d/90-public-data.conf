[Unit]
PartOf=domino-public-data.target

[Timer]
OnBootSec=
OnBootSec=30s
# Also 30 s after every activation of this timer. The target restarts it with
# every restart of a lane or of the egress; activated again with no run since
# boot, it could stay elapsed and never fire, as both timers did from the
# 23 Sep 2026 reboot to 26 Sep.
OnActiveSec=30s
OnUnitActiveSec=
OnUnitInactiveSec=60s
AccuracySec=1s
RandomizedDelaySec=2s
