[Unit]
After=domino-continuous-egress.service
BindsTo=domino-continuous-egress.service
PartOf=domino-public-data.target
StartLimitIntervalSec=300
StartLimitBurst=30

[Service]
WorkingDirectory=@PUBLIC_ROOT@/current/backend
ExecStart=
ExecStart=@QUEUE_ROOT@/venv/bin/python -B manage_activity.py --queue-worker --search-back-blocks 400000 --search-span 5000 --search-max-spans 80 --max-pools 64 --max-steps 1 --span 100000 --span-floor 1000 --lag 100 --parallel-walks --max-header-calls 1000 --max-rpc-calls 2048 --max-seconds 50 --stale-claim-seconds 90
TimeoutStartSec=65
