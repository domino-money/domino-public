[Unit]
After=domino-continuous-egress.service
BindsTo=domino-continuous-egress.service
PartOf=domino-public-data.target
StartLimitIntervalSec=300
StartLimitBurst=30

[Service]
WorkingDirectory=@PUBLIC_ROOT@/current/backend
# The writer reads only the names continuous_egress_policy.py pinned with its
# egress set, never a DNS answer outside that set (#315).
BindReadOnlyPaths=/etc/domino/continuous-reads/write.hosts:/etc/hosts
# A requested pool the catalogue lacks is older than the catalogue: its
# Initialize is searched below the catalogue's start, a million blocks a window
# (5-9 s on the own node), 20 s a run, resumed from where the last run stopped.
# No claim starts with less than 10 s of the run left.
ExecStart=
ExecStart=@QUEUE_ROOT@/venv/bin/python -B manage_activity.py --queue-worker --search-span 1000000 --search-max-spans 64 --search-seconds 20 --claim-reserve-seconds 10 --max-pools 64 --max-steps 1 --span 100000 --span-floor 10 --lag 100 --parallel-walks --max-header-calls 1000 --max-rpc-calls 2048 --max-seconds 50 --stale-claim-seconds 90
TimeoutStartSec=65
