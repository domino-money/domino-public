# Reviewed-source candidate for #45; this file does not provision a deployment.
# Only the reviewed domino-app Pages Function may call this Worker via a binding.
# No Internet endpoint or scheduled trigger is configured here.
# Deposit Access identity, secrets and Tunnel mapping remain deferred.
name = "domino-deposit-bridge"
main = "src/deposit-worker.mjs"
compatibility_date = "2026-09-10"
workers_dev = false
preview_urls = false
routes = []
logpush = false

[observability]
enabled = false

[vars]
DEPOSIT_BRIDGE_ENABLED = "false"
APP_ORIGIN = "https://domino.money"
DEPOSIT_GATEWAY_ORIGIN = "https://vm-deposit.domino.money"

# Access client IDs/secrets are provisioned separately in Cloudflare after review.
# Do not add credentials, account overrides or environment bindings to this file.
