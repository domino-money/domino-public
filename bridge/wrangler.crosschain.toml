# Reviewed-source candidate for crosschain-v1 (spec F7 §3.2, S2, open point #17); this file does not provision a deployment.
# Only the reviewed domino-app Pages Function may call this Worker via a binding.
# No Internet endpoint or scheduled trigger is configured here.
name = "domino-crosschain-bridge"
main = "src/crosschain-worker.mjs"
compatibility_date = "2026-10-02"
workers_dev = false
preview_urls = false
routes = []
logpush = false

[observability]
enabled = false

[vars]
CROSSCHAIN_BRIDGE_ENABLED = "false"
APP_ORIGIN = "https://domino.money"
CROSSCHAIN_GATEWAY_ORIGIN = "https://vm-crosschain.domino.money"
# Exact Pages preview origins this Worker also admits, comma-separated (4 Nov 2026, launch round P3): none.
# Listing one also needs the listener's DOMINO_SESSION_PREVIEW_ORIGINS; docs/PREVIEW_PUBLIC_READS.md.
PREVIEW_ORIGINS = ""

# Access client IDs/secrets are provisioned separately in Cloudflare after review.
# Do not add credentials, account overrides or environment bindings to this file.
