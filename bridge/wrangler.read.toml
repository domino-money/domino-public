# Reviewed-source candidate for #45; this file does not provision a deployment.
# Only the reviewed domino-app Pages Function may call this Worker via a binding.
# No Internet endpoint or scheduled trigger is configured here.
name = "domino-read-bridge"
main = "src/worker.mjs"
compatibility_date = "2026-09-09"
workers_dev = false
preview_urls = false
routes = []
logpush = false

# The Worker's one hop record per request is kept in Workers Logs (authorized
# 2026-09-18, docs/READ_PATH_RECORDS.md). Invocation logs stay off: they carry
# the raw method and URL that record exists not to keep. Retention is the
# account's Workers plan: 3 days on Free, 7 on Paid.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[vars]
READ_BRIDGE_ENABLED = "false"
READ_V2_BRIDGE_ENABLED = "false"
READ_V3_BRIDGE_ENABLED = "false"
READ_V4_BRIDGE_ENABLED = "false"
APP_ORIGIN = "https://domino.money"
GATEWAY_ORIGIN = "https://vm-read.domino.money"
ENABLED_READS = ""
ENABLED_V2_READS = ""
ENABLED_V3_READS = ""
ENABLED_V4_READS = ""

# Access client IDs/secrets are provisioned separately in Cloudflare after review.
# Do not add credentials, account overrides or environment bindings to this file.
