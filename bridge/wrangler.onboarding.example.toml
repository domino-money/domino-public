# Documentation only. No hostname, route, binding or service is provisioned.
name = "domino-onboarding-bridge-example"
main = "src/onboarding-worker.mjs"
compatibility_date = "2026-09-10"
workers_dev = false
preview_urls = false

[vars]
ONBOARDING_BRIDGE_ENABLED = "false"
APP_ORIGIN = "https://domino.money"
ONBOARDING_GATEWAY_ORIGIN = "https://onboarding-origin.domino.money"

# ONBOARDING_ACCESS_CLIENT_ID / ONBOARDING_ACCESS_CLIENT_SECRET are separate
# onboarding service identity secrets. Never put them here or reuse read/session
# identities. This proposed hostname has no provisioned DNS, Access or Tunnel.
