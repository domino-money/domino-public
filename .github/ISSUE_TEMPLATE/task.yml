name: Development task
description: A bounded, reviewable contribution
title: ""
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the user-visible result or concrete backend capability.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable behavior and relevant validation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and dependencies
      description: Expected files, API coordination and explicit non-goals.
