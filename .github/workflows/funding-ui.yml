name: Position journeys
on:
  pull_request:
    paths:
      - 'app/**'
      - 'web/lib/**'
      - 'api-contracts/**'
      - '.github/workflows/funding-ui.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'web/lib/**'
      - 'api-contracts/**'
      - '.github/workflows/funding-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: funding-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  funding:
    name: Funding, automation and history in browser
    runs-on: ubuntu-24.04
    # 40 since 2026-10-16 (V4): the suite already used 23.5-24 of its 25 minutes on main; V4's blurs and gradients cost
    # more to paint without a GPU (the same 210 tests: 1182 s on main a78996d5, 1438 s on V4), so 25 cancelled it mid-run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            app/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix app ci --no-audit --no-fund
      - run: npm --prefix app run build:unit
      - run: npm --prefix app run build:wallet-test-v2
      - name: Verify funding, recovery, automation and history with local wallets and services
        working-directory: app
        run: node --test --test-force-exit tests/v2in-browser/funds-offer.test.mjs tests/v2in-browser/funds-zap.test.mjs tests/v2in-browser/funds-recovery.test.mjs tests/v2in-browser/journey.test.mjs tests/v2in-browser/automate.test.mjs tests/v2in-browser/lists.test.mjs tests/v2in-browser/position.test.mjs tests/v2in-browser/position-v1-page.test.mjs tests/v2in-browser/bulk-close.browser.test.mjs tests/v2in-browser/wallet-refresh.browser.test.mjs tests/v2in-browser/token-artwork.test.mjs
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: position-funding-failures
          path: app/.test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
