name: Automation OFF synthetic rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-ubuntu:
    name: Archive, OFF units and local gas peer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-api.lock
      - name: Check archive plan and OFF policy without host changes
        run: python -B scripts/staging/rehearse_automation_off_ci.py plan
      - name: Install locked test dependencies
        run: python -m pip install -r backend/requirements-api.lock
      - name: Parse units and prove Linux peer credentials with synthetic users
        run: sudo -n "$(command -v python)" -B scripts/staging/rehearse_automation_off_ci.py native
