name: Publish read path
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect access, publish app, bridge (tunnels and Worker), or both after the VM is ready
        type: choice
        options: [inspect, app, bridge, publish, disable-sequence-snapshot]
        default: inspect
        required: true
      source_sha:
        description: Exact main commit to inspect or publish
        type: string
        required: true
      enable_public_data:
        description: Enable the read-v3 stored public data routes after the VM is ready
        type: boolean
        default: false
        required: true
      enable_sequence_snapshot:
        description: Enable the fixed V1 sequence snapshot only after the reader and gateway are qualified
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: publish-read-path
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the dispatched main commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Inspect existing Cloudflare access without printing credentials
        run: node scripts/publish-read-path.mjs inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - if: inputs.operation == 'app' || inputs.operation == 'publish'
        run: npm --prefix app ci --no-audit --no-fund
      - name: Build and record the app without deployment credentials
        if: inputs.operation == 'app' || inputs.operation == 'publish'
        run: npm --prefix app run release:build
      - name: Publish the reviewed read paths, adding production read-v3 only when selected
        if: inputs.operation == 'bridge' || inputs.operation == 'publish'
        run: node scripts/publish-read-path.mjs tunnels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOMINO_RELEASE_PUBLIC_DATA: ${{ inputs.enable_public_data }}
          DOMINO_RELEASE_SEQUENCE_SNAPSHOT: ${{ inputs.enable_sequence_snapshot }}
      - name: Publish the read Worker, retaining v1/v2 reads and enabling v3 only when selected
        if: inputs.operation == 'bridge' || inputs.operation == 'publish'
        run: node scripts/publish-read-path.mjs worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOMINO_RELEASE_PUBLIC_DATA: ${{ inputs.enable_public_data }}
          DOMINO_RELEASE_SEQUENCE_SNAPSHOT: ${{ inputs.enable_sequence_snapshot }}
      - name: Disable the V4 read Worker before removing the V4 tunnel path
        if: inputs.operation == 'disable-sequence-snapshot'
        run: node scripts/publish-read-path.mjs worker-disable-v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove only the V4 production read tunnel path
        if: inputs.operation == 'disable-sequence-snapshot'
        run: node scripts/publish-read-path.mjs tunnels-disable-v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload the same recorded app to preview and production
        if: inputs.operation == 'app' || inputs.operation == 'publish'
        run: |
          npm --prefix app run deploy:preview
          npm --prefix app run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
