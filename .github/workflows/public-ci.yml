name: Public CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    name: Public offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Check tracked repository hygiene
        run: python3 scripts/check-repository.py
      - name: Verify public and private CI boundaries with synthetic fixtures
        run: |
          node --test scripts/ci/*.test.mjs scripts/preview-workflow.test.mjs scripts/check-app-jobs.test.mjs
          python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
          bash -n scripts/ci/prepare-image.sh scripts/ci/run-pilot-workload.sh
      - name: Check Solidity source hygiene
        run: node --test scripts/check-contract-hygiene.test.mjs && node scripts/check-contract-hygiene.mjs
      - name: Verify release configuration with synthetic responses
        run: node --test scripts/publish-read-path.test.mjs scripts/inspect-execution-cloudflare.test.mjs scripts/read-tunnel-config.test.mjs scripts/execution-tunnel-config.test.mjs
