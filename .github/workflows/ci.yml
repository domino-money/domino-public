name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Replace obsolete PR checks. Every main push is a group of its own, its
  # commit, so no main run is ever cancelled, nor dropped as a pending run when
  # a later push arrives (GitHub keeps one pending run per group): each main
  # commit gets a finished CI (audit H9, 2026-10-01). The preview job below
  # orders their uploads. Manual checks have their own group.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check-repository.py
      - name: Check Solidity hygiene
        run: node --test scripts/check-contract-hygiene.test.mjs && node scripts/check-contract-hygiene.mjs
      - name: Check staging helpers without host access
        run: |
          python3 -B -m unittest discover -s scripts/staging/tests -p test_staging_helpers.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_upgrade_disabled.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_egress_probe.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_continuous_egress_policy.py -v
      - name: Check offline staging egress policy candidates
        run: |
          python3 -B -m unittest discover -s scripts/staging/tests -p test_egress_policy.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_egress_window_probe.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_dev_infrastructure.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_dev_native_install.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_dev_egress_policy.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_dev_network_off.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_dev_enable.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_continuous_egress_write.py -v
      - name: Check disabled bridge deployment candidates
        run: |
          python3 scripts/staging/check_bridge_configs.py
          python3 -m unittest discover -s scripts/staging -p test_bridge_configs.py -v
      - name: Check the inactive Tunnel unit candidate
        run: |
          python3 -B -m unittest discover -s scripts/cloudflared/tests -v
          systemd-analyze --version
          systemd-analyze verify --man=no scripts/cloudflared/domino-tunnel.service
      - name: Check the Tunnel release tooling without credentials
        run: node --test scripts/publish-read-path.test.mjs scripts/read-tunnel-config.test.mjs scripts/execution-tunnel-config.test.mjs
      - name: Check the execution Cloudflare preflight without credentials
        run: node --test scripts/inspect-execution-cloudflare.test.mjs
      - name: Check the read-path release installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_read_release.py -v
      - name: Check the fresh-host installers without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_fresh_host.py -v
      - name: Check the session listener release installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_auth_release.py -v
      - name: Check the performance and execution-status release installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_financial_release.py -v
      - name: Check the S1 plan listener installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_position_plan.py -v
      - name: Check the V2 automation installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_v2_automation.py -v
      - name: Check the production monitor installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_monitor.py -v
      - name: Check the S2 crosschain listener installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_crosschain.py -v
      - name: Check every release installer's drop-ins and the automation boot target against the runner's own systemd
        run: sudo -n env DOMINO_TEST_REAL_SYSTEMD=1 python3 -B -m unittest discover -s scripts/staging/tests -p test_financial_release_systemd.py -v
      - name: Check the public-data installer and rollback without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_public_data.py -v
      - name: Check the automation installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_automation.py -v
      - name: Check the installed automation readiness upgrade without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_upgrade_automation_readiness.py -v
      - name: Check the automation release installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_automation_release.py -v
      - name: Check the automation boot target installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_automation_boot.py -v
      - name: Check the inactive reference-collector unit candidates
        run: |
          python3 -B -m unittest discover -s scripts/reference-collector/tests -v
          systemd-analyze verify --man=no scripts/reference-collector/domino-reference-collector.service
          systemd-analyze verify --man=no scripts/reference-collector/domino-reference-collector.timer
  changes:
    name: What the change touches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.paths.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's checkout is its merge commit: the first parent is
          # the base it merges into, so the two commits are all this needs.
          fetch-depth: 2
      # The browser suites load app/, web/, api-contracts/ and bridge/, never
      # the backend, the contracts, the root scripts, docs, ops or reports
      # (audit H2: PR #272 changed docs only and ran all three suites). A pull
      # request that changes only those, or only Markdown at the root, skips
      # them; every other change, every main push and every manual run runs
      # them. When the change cannot be read, they run.
      - id: paths
        name: Decide whether the browser suites can be affected
        env:
          EVENT: ${{ github.event_name }}
        # The list is read from a here-string, not a pipe: under pipefail a
        # grep -q that stops early can fail the writer of a long list and
        # turn "a browser file changed" into "nothing did".
        run: |
          browser=true
          if [ "$EVENT" = pull_request ] && changed=$(git diff --name-only HEAD^1 HEAD); then
            printf '%s\n' "$changed"
            seen=$(grep -Ev '^(backend|contracts|docs|ops|reports|scripts)/|^[^/]+\.md$|^\.python-version$' <<< "$changed" || true)
            if [ -n "$changed" ] && [ -z "$seen" ]; then browser=false; fi
          fi
          echo "browser=$browser" | tee -a "$GITHUB_OUTPUT"
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    # The web checks, the shared types and check:app up to its build: about 4
    # minutes on run 36114583875. check:app's browser suites run beside this job
    # in frontend_browser.
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            app/package-lock.json
      - name: Check preview deployment policy without credentials
        run: node --test scripts/preview-workflow.test.mjs
      - name: Check that the frontend jobs run every part of check:app
        run: node --test scripts/check-app-jobs.test.mjs
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm run check:web
      - name: Check shared read types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/read-v1/types.ts api-contracts/read-v1/runtime.d.mts api-contracts/read-v1/consumer.typecheck.mts
      - name: Check opt-in pool estimate types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/read-v2/types.ts api-contracts/read-v2/runtime.d.mts api-contracts/read-v2/consumer.typecheck.mts
      - name: Check stored public read types and validators
        run: |
          node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/read-v3/types.ts api-contracts/read-v3/runtime.d.mts api-contracts/read-v3/consumer.typecheck.mts
          node --test api-contracts/read-v3/consumer.test.mjs
      - name: Check featured pools list types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/read-v5/runtime.d.mts
      - name: Check shared session types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/session-v1/types.ts api-contracts/session-v1/runtime.d.mts
      - name: Check shared onboarding types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/onboarding-v1/types.ts api-contracts/onboarding-v1/runtime.d.mts api-contracts/onboarding-v1/consumer.typecheck.mts
      - name: Check shared deposit types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/deposit-v1/types.ts api-contracts/deposit-v1/runtime.d.mts api-contracts/deposit-v1/consumer.typecheck.mts
      - name: Check shared performance types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/performance-v1/types.ts api-contracts/performance-v1/runtime.d.mts api-contracts/performance-v1/consumer.typecheck.mts
      - name: Check cross-chain deposit types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/crosschain-v1/types.ts api-contracts/crosschain-v1/runtime.d.mts
      - name: Check V2 wallet read types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/read-v6/types.ts api-contracts/read-v6/runtime.d.mts
      - name: Check S1 position plan types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/position-plan-v1/types.ts api-contracts/position-plan-v1/runtime.d.mts
      - run: npm --prefix app ci --no-audit --no-fund
      # check:app up to its build, one step each; its browser suites follow in
      # frontend_browser (scripts/check-app-jobs.test.mjs holds the two lists
      # to check:app).
      - run: npm --prefix app test
      - run: npm --prefix app run typecheck
      - run: npm --prefix app run lint
      - run: npm --prefix app run build
      # --test-force-exit, as every browser suite in app/package.json runs:
      # on macOS, processes Chrome leaves behind can hold its pipes open and
      # keep a finished test file alive (app/tests/support/close-browser.mjs).
      - name: Check pool estimate contract in a real browser
        run: node --test --test-force-exit api-contracts/read-v2/consumer.browser.test.mjs
  read_bridge:
    name: Read Worker
    runs-on: ubuntu-24.04
    # The read Worker's own checks (bridge/ and the read contracts it
    # consumes): about 2 seconds, and no install. A job of their own, so a
    # failure elsewhere never skips them (audit H8: they were a late step of
    # Backend, skipped whenever an earlier backend step failed).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: npm run check:read-bridge
  frontend_browser:
    name: Frontend browser (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    # check:app's browser suites, one job each: test:render is test:pages and
    # then test:finance, and test:gate follows. These 2-vCPU runners give
    # node --test one file at a time, so in one job the suites ran end to end
    # and outgrew the limit twice: 15 minutes (runs #336/#337), then 25 (runs
    # 35948947372 and 36071207614 were cut there with no test failed or hung).
    # Run 36114583875 spent 6.8 minutes on pages, 7.4 on finance (0.7 on
    # 19 September) and 9.4 on gate; each job adds about a minute to install
    # and build.
    # The recovery/saved-history suite completed its 136 checks in 19 minutes
    # on run 36648824770, then the 20-minute job limit interrupted reporting
    # (installation and both builds take another minute). Keep every assertion
    # and give the complete browser suites bounded reporting headroom.
    # Then finance ran 19 of these 25 minutes (PR #280, 2026-10-01: 1,128 s of
    # tests), twice what it took six days before (audit H2). Its suite now runs
    # in three parts, each beside the smaller files closest to it
    # (app/tests/support/parts.mjs): 350, 369 and 409 s of tests on PR #280's
    # timings, about 7 to 8 minutes a job with install and builds. Each job
    # warns when it passes 80% of this limit (its last step).
    timeout-minutes: 25
    strategy:
      # Every suite reports, even when another one fails.
      fail-fast: false
      matrix:
        suite: [pages, finance-create, finance-automation, finance-positions, gate]
    env:
      WRANGLER_SEND_METRICS: 'false'
      # The finance suite keeps a picture of every page open when a test of
      # it fails (app/tests/support/parts.mjs), uploaded below.
      DOMINO_FAILURE_SHOTS: '1'
    steps:
      - name: Note when the job starts
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            app/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix app ci --no-audit --no-fund
      # What check:app has built by the time its browser suites run: the unit
      # build, which the fake chains and the gated server's middleware load,
      # and dist.
      - name: Build what the browser suites load
        run: npm --prefix app run build:unit && npm --prefix app run build
      - run: npm --prefix app run test:${{ matrix.suite }}
      - name: Keep the pictures of the failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failures-${{ matrix.suite }}
          path: app/.test-artifacts/failures/
          if-no-files-found: ignore
          retention-days: 7
      - name: Warn past 80% of the time limit
        if: always()
        env:
          # timeout-minutes above (scripts/check-app-jobs.test.mjs holds them equal).
          LIMIT_MINUTES: 25
          SUITE: ${{ matrix.suite }}
        run: |
          used=$(( $(date +%s) - JOB_STARTED_AT ))
          echo "${SUITE}: ${used} s of $(( LIMIT_MINUTES * 60 )) s"
          if [ $(( used * 100 )) -gt $(( LIMIT_MINUTES * 60 * 80 )) ]; then
            echo "::warning title=${SUITE} is near its time limit::$(( used / 60 )) min $(( used % 60 )) s of ${LIMIT_MINUTES} min. Split it further (app/tests/support/parts.mjs) before the limit cuts it off."
          fi
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    # The artifact build for the EVM tests (issue #144) adds a full Forge
    # compilation. Last 60 runs: 13-19 minutes warm (backend tests 11.5-16).
    # Cold, the three builds add about 8: 25 minutes on run 36927967030 (#284).
    # The cache below now survives .sol changes, so a cold build only follows
    # a compiler change or a missing cache. The V2 closure (a fourth build,
    # 83 s cold on a Mac) leaves too little margin under 30 when cold.
    timeout-minutes: 40
    env:
      DOMINO_TEST_POSTGRES: '1'
      DOMINO_TEST_EVM: '1'
      DOMINO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Forge compilation artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/cache
            contracts/out
          # Exact source tree first; otherwise the newest cache from the same
          # compiler and settings, which scripts/forge-cache.mjs prunes below.
          # Each job keeps its own cache: with one shared key the Backend, which
          # builds three closures and finishes first, saved its subset and the
          # Contracts job could not save its full set (run 36934135396, #285).
          # The last fallback is that shared cache.
          # forge-backend-v2: the V2 closure joined the set this job builds; an
          # exact hit on the old key would never save it (an exact hit saves nothing).
          key: forge-backend-v2-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'package-lock.json', 'scripts/solc-wrapper.py', 'scripts/solc-compile.cjs') }}-${{ hashFiles('contracts/**/*.sol') }}
          restore-keys: |
            forge-backend-v2-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'package-lock.json', 'scripts/solc-wrapper.py', 'scripts/solc-compile.cjs') }}-
            forge-backend-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'package-lock.json', 'scripts/solc-wrapper.py', 'scripts/solc-compile.cjs') }}-
            forge-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'package-lock.json', 'scripts/solc-wrapper.py', 'scripts/solc-compile.cjs') }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-api.lock
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix app ci --no-audit --no-fund
      - run: python -m pip install -r backend/requirements-api.lock
      - name: Drop cached Forge artifacts this checkout invalidates
        run: node scripts/forge-cache.mjs prune
      # Compile the artifact tree the backend EVM tests load: the DominoSetup
      # test pulls PoolManager, PositionManager, StateView and SetupToken.
      # A whole-tree forge build OOMs soljson; the positional path compiles
      # only this closure (issue #144). This pinned forge has no --match-path
      # on build, so the path is positional, and forge resolves it against
      # the project root: run from contracts/ or the solc import callback
      # receives doubled "contracts/contracts/..." paths.
      - name: Build contract artifacts for backend EVM tests
        working-directory: contracts
        run: node ../scripts/test-contracts.mjs build test/setup/DominoSetup.t.sol
      # The backend EVM tests deploy the whole V4 stack from contracts/out; this
      # suite's closure builds every artifact they load, as the V3 receipt
      # fixture did before V3 was retired.
      - name: Build and qualify the V4 execution fixture
        run: node scripts/test-contracts.mjs --match-path test/reference/OfficialDominoExecutionV4.t.sol
      # The legacy charged-lot receipt case uses an explicitly seeded test vault;
      # no production API can create that historical initial state.
      - name: Build and qualify swap reinvestment and legacy charged balances
        run: node scripts/test-contracts.mjs --match-path test/audit_engine/SwapReinvestment.t.sol
      - name: Build public V1 contracts and prove equivalence to the internal V4 bases
        run: node scripts/build-public-release.mjs
      - name: Independently reproduce the reviewed release artifact manifest
        run: node scripts/release-artifact-manifest.mjs --check
      # The V2 EVM tests (backend/tests/test_v2_automation_evm.py and
      # test_v2_indexer_evm.py) deploy every V2 component from contracts/out.
      # Cold, these 10 contracts (53 sources) compiled in 83 s on a Mac on
      # 2 Oct 2026; a warm cache rebuilds nothing. Uniswap's runtimes come from
      # the fixture source, OfficialV4SwapDriver and SetupToken from the builds above.
      - name: Build the V2 contracts the backend EVM tests deploy
        working-directory: contracts
        run: >-
          node ../scripts/test-contracts.mjs build
          src/v2/registry/DominoRegistry.sol src/v2/anchor/DominoPriceAnchor.sol
          src/v2/autoexit/DominoAutoExit.sol src/v2/vault/DominoV2VaultSwapModule.sol
          src/v2/vault/DominoV2VaultV3.sol src/v2/vault/DominoV2VaultV4.sol src/v2/vault/DominoV2VaultFactory.sol
          src/v2/zap/DominoZapV3.sol src/v2/zap/DominoZapV4.sol src/v2/zap/DominoZapV4Steps.sol
      - run: python scripts/export-read-contract.py --check
      - run: python scripts/export-read-v2-contract.py --check
      - run: python scripts/export-read-v3-contract.py --check
      - run: python scripts/check-read-v3-parity.py
      - run: python scripts/export-read-openapi.py --check
      - run: python scripts/export-session-contract.py --check
      - run: python scripts/export-onboarding-contract.py --check
      - run: python scripts/export-deposit-contract.py --check
      - run: python scripts/export-performance-contract.py --check
      - run: python scripts/export-performance-v2-contract.py --check
      - run: python scripts/export-execution-contract.py --check
      # npm run check:read-bridge ran here until 2026-10-01: it is the Read
      # Worker job now, which a failed step above can no longer skip.
      - run: python scripts/export-crosschain-contract.py --check
      - run: python scripts/export-read-v6-contract.py --check
      - run: python scripts/export-position-plan-contract.py --check
      - name: Check PostgreSQL tools
        run: test -x "$DOMINO_PG_BIN/initdb"
      - name: Check staging catalogue inventory in a disposable cluster
        run: |
          DOMINO_TEST_STAGING_POSTGRES=1 python -B -m unittest discover -s scripts/staging/tests -p test_catalogue_postgres.py -v
          DOMINO_TEST_STAGING_POSTGRES=1 python -B -m unittest discover -s scripts/staging/tests -p test_upgrade_postgres.py -v
          DOMINO_TEST_STAGING_POSTGRES=1 python -B -m unittest discover -s scripts/staging/tests -p test_dev_catalogue_profile.py -v
          DOMINO_TEST_STAGING_POSTGRES=1 python -B -m unittest discover -s scripts/staging/tests -p test_upgrade_financial.py -v
      - run: python backend/dev_postgres.py prepare-tests
      - run: python -m unittest discover -s backend/tests -v
      - name: Verify unsigned financial deployment tooling on disposable EVM
        run: node --test scripts/prepare-financial-release.test.mjs scripts/prepare-financial-release-rpc.test.mjs scripts/release-artifact-manifest.test.mjs scripts/build-public-release.test.mjs
      # The V2 deployment tool's tests compile every V2 source with the pinned
      # solc-js (about 90 s cold). The output depends only on those sources and
      # the compiler, so it is cached under them; the tool reuses an entry only
      # for an identical standard-JSON input, and production commands always compile.
      - name: Restore the V2 deployment tool's test compile
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/v2-deploy-compile
          key: v2-deploy-compile-${{ runner.os }}-${{ hashFiles('contracts/src/v2/**/*.sol', 'scripts/solc-compile.cjs', 'package-lock.json') }}
      - name: Verify V2 unsigned CREATE3 deployment tooling offline
        env:
          DOMINO_V2_COMPILE_CACHE: ${{ runner.temp }}/v2-deploy-compile
        run: node --test scripts/v2/deploy.test.mjs scripts/v2/deploy-preflight.test.mjs scripts/v2/deploy-schema.test.mjs scripts/v2/deploy-fork.test.mjs scripts/v2/release-manifest.test.mjs
      # The V2 freeze (docs/v2/FREEZE.md): the reviewed release manifest must be
      # what this compile produces, and the Foundry artifacts the backend EVM
      # tests deploy (built above) the same contracts. The compile is the
      # cached one of the step above, reused only for an identical input.
      - name: Reproduce the V2 release artifact manifest
        env:
          DOMINO_V2_COMPILE_CACHE: ${{ runner.temp }}/v2-deploy-compile
        run: node scripts/v2/release-manifest.mjs --check --forge-out contracts/out
      - name: Record the sources of the cached Forge artifacts
        run: node scripts/forge-cache.mjs record
      - name: Stop isolated database
        if: always()
        run: python backend/dev_postgres.py stop
  contracts:
    name: Contracts (${{ matrix.part }})
    runs-on: ubuntu-24.04
    # Two jobs in parallel, each with its own Forge cache: v1 runs every suite
    # outside contracts/test/v2, v2 the V2 suites and the V2 export check. One
    # job no longer fit a cold run: the 22 V1 suites alone took 33.4-35.1 min
    # cold on CI (runs 36937969488, 36934135396, 36927967030), and the V2
    # suites since F1-F4 add about 35 min more (F1b 6.8, F1c 5.4, F2 and F3
    # about 9 each, measured on their first compiles), so the single job was
    # near its 75-minute limit before any integration suite. Split, each half
    # stays near 35-40 minutes cold; a cold run follows a compiler change or a
    # missing cache. The limit stays at 75 per half (issue #145 for the
    # original one-closure-per-suite layout). The V2 integration journeys
    # (#303) add about 5 minutes to a cold v2 half: 29m19s cold on a Mac with
    # them against 26m32s without, side by side, where main's near-cold v2
    # half took 42m52s on CI (run 37066559693); docs/v2/INTEGRATION_TESTS.md
    # has the measurements. The V2 audit suites (contracts/test/v2/adversarial
    # and invariant, #319) are a third part: with them the v2 half's 67 suites
    # took 71.1 minutes cold on CI, 61 of them compiling, and the gas check
    # then met the limit (run 37173015030). The 19 audit suites took 32.0 of
    # those minutes, the other 48 the remaining 39.1.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        part: [v1, v2, v2-audit]
    env:
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Forge compilation artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/cache
            contracts/out
          # Exact source tree first; otherwise the newest cache from the same
          # compiler and settings, which scripts/forge-cache.mjs prunes below.
          # Each half keeps its own cache (one shared key lets the job that
          # finishes first save its subset, run 36934135396, #285). The
          # fallbacks are the single Contracts job's cache and the shared one.
          key: forge-contracts-${{ matrix.part }}-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'package-lock.json', 'scripts/solc-wrapper.py', 'scripts/solc-compile.cjs') }}-${{ hashFiles('contracts/**/*.sol') }}
          restore-keys: |
            forge-contracts-${{ matrix.part }}-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'package-lock.json', 'scripts/solc-wrapper.py', 'scripts/solc-compile.cjs') }}-
            forge-contracts-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'package-lock.json', 'scripts/solc-wrapper.py', 'scripts/solc-compile.cjs') }}-
            forge-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'package-lock.json', 'scripts/solc-wrapper.py', 'scripts/solc-compile.cjs') }}-
      - run: npm ci --no-audit --no-fund
      - name: Drop cached Forge artifacts this checkout invalidates
        run: node --test scripts/forge-cache.test.mjs && node scripts/forge-cache.mjs prune
      # The integration suites (contracts/test/v2/integration) import only
      # interfaces and deploy every contract from its artifact: the V2
      # contracts below and the helpers and fixture runtimes of
      # IntegrationArtifacts.sol, built here before any suite runs. solc
      # 0.8.26 recompiles every concrete contract in a test file's import
      # closure whenever the file is rebuilt (Forge lists them with no
      # outputs), so the first integration suites, which imported them, paid
      # 25 CI minutes for seven files (run 37021480059, PR #303).
      - name: Build the V2 contracts and test artifacts the integration suites deploy
        if: matrix.part != 'v1'
        working-directory: contracts
        run: >-
          node ../scripts/test-contracts.mjs build
          src/v2/registry/DominoRegistry.sol src/v2/anchor/DominoPriceAnchor.sol
          src/v2/autoexit/DominoAutoExit.sol src/v2/vault/DominoV2VaultSwapModule.sol
          src/v2/vault/DominoV2VaultV3.sol src/v2/vault/DominoV2VaultV4.sol src/v2/vault/DominoV2VaultFactory.sol
          src/v2/zap/DominoZapV3.sol src/v2/zap/DominoZapV4.sol src/v2/zap/DominoZapV4Steps.sol
          test/v2/integration/IntegrationArtifacts.sol
      # One suite at a time: a single forge invocation compiles every source in
      # one soljson payload and aborts (OOM) on the whole vendored v4 tree, so
      # the job must build each suite's dependency closure separately with a
      # shared Forge cache (issue #145).
      - name: Run the contract suites, one dependency closure at a time
        run: |
          set -e
          # The same partition as scripts/gas-baseline.mjs's inPart.
          case "$PART" in
            v2-audit) suites=$(find contracts/test/v2/adversarial contracts/test/v2/invariant -name '*.t.sol' | sort) ;;
            v2) suites=$(find contracts/test/v2 -name '*.t.sol' -not -path 'contracts/test/v2/adversarial/*' -not -path 'contracts/test/v2/invariant/*' | sort) ;;
            *) suites=$(find contracts/test -name '*.t.sol' -not -path 'contracts/test/v2/*' | sort) ;;
          esac
          for suite in $suites; do
            echo "::group::${suite}"
            node scripts/test-contracts.mjs --match-path "${suite#contracts/}"
            echo "::endgroup::"
          done
      # The V2 interface freeze (docs/v2/F0_INTERFACES.md): the committed ABIs,
      # selectors and the generated interface-id pins must match the sources.
      - name: Check the V2 interface exports
        if: matrix.part == 'v2'
        run: node scripts/v2/export-abi.mjs --check
      # The deployed Uniswap runtimes the V2 position suites etch, and the
      # vendored math in contracts/src/v2/positions/uniswap against its
      # reference copies (docs/v2/F1_POSITIONS.md). Offline, under a second.
      - name: Check the V2 position fixtures and vendored math
        if: matrix.part == 'v2'
        run: node scripts/v2/position-fixtures.mjs check
      # Deterministic gas per test against the committed baseline; a regression
      # fails here instead of surfacing in a report months later. Each half
      # checks the entries of the test contracts its own suites declare.
      - name: Check the gas baseline
        run: node --test scripts/gas-baseline.test.mjs scripts/mutate-contracts.test.mjs && node scripts/gas-baseline.mjs --check --part "$PART"
      - name: Record the sources of the cached Forge artifacts
        run: node scripts/forge-cache.mjs record
  preview:
    name: Deploy gated preview
    needs: [hygiene, frontend, read_bridge, frontend_browser, backend, contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One upload at a time. Main runs no longer wait for each other (the
    # concurrency at the top), so two may reach this job close together: a
    # newer commit's upload waiting here replaces an older one still waiting,
    # and an older commit never uploads over a newer one (the check below).
    concurrency:
      group: deploy-gated-preview
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --no-audit --no-fund
      - name: Build and record exactly what will be uploaded
        run: npm --prefix app run release:build
      # Asked after the build, just before the upload: a commit main has moved
      # past gives way to the newer one's run, which uploads its own build
      # once its checks pass. When main cannot be read, nothing is uploaded.
      - name: Check that this commit is still the newest on main
        id: newest
        run: |
          newest=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "main is at ${newest:-a commit that could not be read}; this run built ${GITHUB_SHA}"
          if [ "$newest" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "current=false" >> "$GITHUB_OUTPUT"; fi
      # A repository variable, GATED_PREVIEW_HOLD set to true, keeps a preview
      # deployed by hand (a package the owner is testing) where it is: the build
      # is still made and recorded, and nothing is uploaded. Delete the variable
      # to let main's CI deploy again. Nobody cancels a main run for this.
      - name: Deploy that recorded dist to the gated preview
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && steps.newest.outputs.current == 'true' && vars.GATED_PREVIEW_HOLD != 'true'
        run: npm --prefix app run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A repository variable, not a secret: the account id is an
          # identifier that already appears in dashboard URLs and wrangler
          # configs, and hiding it would only cost the owner a step.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Say why nothing was deployed
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Preview not deployed::Set CLOUDFLARE_API_TOKEN as a repository secret under Settings > Secrets and variables > Actions > Secrets."
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Preview not deployed::Set CLOUDFLARE_ACCOUNT_ID as a repository variable under Settings > Secrets and variables > Actions > Variables."
          fi
          echo "This build was recorded but not uploaded. Once configured, a successful main push run deploys the gated preview."
      - name: Say that a newer main commit uploads instead
        if: steps.newest.outputs.current != 'true'
        run: echo "::notice title=Preview not deployed::This commit is no longer the newest on main (or main could not be read), so this build was recorded but not uploaded; the newer commit's run uploads its own once its checks pass."
      - name: Say that the preview is held
        if: vars.GATED_PREVIEW_HOLD == 'true'
        run: echo "::notice title=Preview held::The repository variable GATED_PREVIEW_HOLD is true, so this build was recorded but not uploaded and the preview deployed by hand stays. Delete the variable under Settings > Secrets and variables > Actions > Variables to let main's CI deploy again."
