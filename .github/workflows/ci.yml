name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check-repository.py
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            app/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm run check:web
      - name: Check shared read types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/read-v1/types.ts api-contracts/read-v1/runtime.d.mts api-contracts/read-v1/consumer.typecheck.mts
      - name: Check shared session types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/session-v1/types.ts api-contracts/session-v1/runtime.d.mts
      - run: npm --prefix app ci --no-audit --no-fund
      - run: npm run check:app
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOMINO_TEST_POSTGRES: '1'
      DOMINO_TEST_EVM: '1'
      DOMINO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-api.lock
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -r backend/requirements-api.lock
      - run: python scripts/export-read-contract.py --check
      - run: python scripts/export-read-openapi.py --check
      - run: python scripts/export-session-contract.py --check
      - run: npm run check:read-bridge
      - name: Check PostgreSQL tools
        run: test -x "$DOMINO_PG_BIN/initdb"
      - run: python backend/dev_postgres.py prepare-tests
      - run: python -m unittest discover -s backend/tests -v
      - name: Stop isolated database
        if: always()
        run: python backend/dev_postgres.py stop
  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:contracts
