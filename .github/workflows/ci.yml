name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Replace obsolete PR checks, but let a main run finish its preview upload.
  # GitHub keeps only the newest pending run; intermediate pushes may coalesce.
  # Manual checks have their own group and cannot displace a pending main push.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/check-repository.py
      - name: Check Solidity hygiene
        run: node --test scripts/check-contract-hygiene.test.mjs && node scripts/check-contract-hygiene.mjs
      - name: Check staging helpers without host access
        run: |
          python3 -B -m unittest discover -s scripts/staging/tests -p test_staging_helpers.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_upgrade_disabled.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_egress_probe.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_continuous_egress_policy.py -v
      - name: Check offline staging egress policy candidates
        run: |
          python3 -B -m unittest discover -s scripts/staging/tests -p test_egress_policy.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_egress_window_probe.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_dev_infrastructure.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_dev_native_install.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_dev_egress_policy.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_dev_network_off.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_dev_enable.py -v
          python3 -B -m unittest discover -s scripts/staging/tests -p test_continuous_egress_write.py -v
      - name: Check disabled bridge deployment candidates
        run: |
          python3 scripts/staging/check_bridge_configs.py
          python3 -m unittest discover -s scripts/staging -p test_bridge_configs.py -v
      - name: Check the inactive Tunnel unit candidate
        run: |
          python3 -B -m unittest discover -s scripts/cloudflared/tests -v
          systemd-analyze --version
          systemd-analyze verify --man=no scripts/cloudflared/domino-tunnel.service
      - name: Check the Tunnel release tooling without credentials
        run: node --test scripts/publish-read-path.test.mjs scripts/read-tunnel-config.test.mjs scripts/execution-tunnel-config.test.mjs
      - name: Check the execution Cloudflare preflight without credentials
        run: node --test scripts/inspect-execution-cloudflare.test.mjs
      - name: Check the read-path release installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_read_release.py -v
      - name: Check the session listener release installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_auth_release.py -v
      - name: Check the performance and execution-status release installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_financial_release.py -v
      - name: Check every release installer's drop-ins and the automation boot target against the runner's own systemd
        run: sudo -n env DOMINO_TEST_REAL_SYSTEMD=1 python3 -B -m unittest discover -s scripts/staging/tests -p test_financial_release_systemd.py -v
      - name: Check the public-data installer and rollback without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_public_data.py -v
      - name: Check the automation installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_automation.py -v
      - name: Check the installed automation readiness upgrade without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_upgrade_automation_readiness.py -v
      - name: Check the automation release installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_automation_release.py -v
      - name: Check the automation boot target installer without host access
        run: python3 -B -m unittest discover -s scripts/staging/tests -p test_install_automation_boot.py -v
      - name: Check the inactive reference-collector unit candidates
        run: |
          python3 -B -m unittest discover -s scripts/reference-collector/tests -v
          systemd-analyze verify --man=no scripts/reference-collector/domino-reference-collector.service
          systemd-analyze verify --man=no scripts/reference-collector/domino-reference-collector.timer
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    # The web checks, the shared types and check:app up to its build: about 4
    # minutes on run 36114583875. check:app's browser suites run beside this job
    # in frontend_browser.
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            app/package-lock.json
      - name: Check preview deployment policy without credentials
        run: node --test scripts/preview-workflow.test.mjs
      - name: Check that the frontend jobs run every part of check:app
        run: node --test scripts/check-app-jobs.test.mjs
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm run check:web
      - name: Check shared read types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/read-v1/types.ts api-contracts/read-v1/runtime.d.mts api-contracts/read-v1/consumer.typecheck.mts
      - name: Check opt-in pool estimate types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/read-v2/types.ts api-contracts/read-v2/runtime.d.mts api-contracts/read-v2/consumer.typecheck.mts
      - name: Check stored public read types and validators
        run: |
          node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/read-v3/types.ts api-contracts/read-v3/runtime.d.mts api-contracts/read-v3/consumer.typecheck.mts
          node --test api-contracts/read-v3/consumer.test.mjs
      - name: Check featured pools list types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/read-v5/runtime.d.mts
      - name: Check shared session types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/session-v1/types.ts api-contracts/session-v1/runtime.d.mts
      - name: Check shared onboarding types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/onboarding-v1/types.ts api-contracts/onboarding-v1/runtime.d.mts api-contracts/onboarding-v1/consumer.typecheck.mts
      - name: Check shared deposit types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/deposit-v1/types.ts api-contracts/deposit-v1/runtime.d.mts api-contracts/deposit-v1/consumer.typecheck.mts
      - name: Check shared performance types
        run: node web/node_modules/typescript/bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext api-contracts/performance-v1/types.ts api-contracts/performance-v1/runtime.d.mts api-contracts/performance-v1/consumer.typecheck.mts
      - run: npm --prefix app ci --no-audit --no-fund
      # check:app up to its build, one step each; its browser suites follow in
      # frontend_browser (scripts/check-app-jobs.test.mjs holds the two lists
      # to check:app).
      - run: npm --prefix app test
      - run: npm --prefix app run typecheck
      - run: npm --prefix app run lint
      - run: npm --prefix app run build
      # --test-force-exit, as every browser suite in app/package.json runs:
      # on macOS, processes Chrome leaves behind can hold its pipes open and
      # keep a finished test file alive (app/tests/support/close-browser.mjs).
      - name: Check pool estimate contract in a real browser
        run: node --test --test-force-exit api-contracts/read-v2/consumer.browser.test.mjs
  frontend_browser:
    name: Frontend browser (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    # check:app's browser suites, one job each: test:render is test:pages and
    # then test:finance, and test:gate follows. These 2-vCPU runners give
    # node --test one file at a time, so in one job the suites ran end to end
    # and outgrew the limit twice: 15 minutes (runs #336/#337), then 25 (runs
    # 35948947372 and 36071207614 were cut there with no test failed or hung).
    # Run 36114583875 spent 6.8 minutes on pages, 7.4 on finance (0.7 on
    # 19 September) and 9.4 on gate; each job adds about a minute to install
    # and build.
    timeout-minutes: 20
    strategy:
      # Every suite reports, even when another one fails.
      fail-fast: false
      matrix:
        suite: [pages, finance, gate]
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            app/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix app ci --no-audit --no-fund
      # What check:app has built by the time its browser suites run: the unit
      # build, which the fake chains and the gated server's middleware load,
      # and dist.
      - name: Build what the browser suites load
        run: npm --prefix app run build:unit && npm --prefix app run build
      - run: npm --prefix app run test:${{ matrix.suite }}
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    # The artifact build for the EVM tests (issue #144) adds a full Forge
    # compilation; 15 minutes no longer leaves safe headroom.
    timeout-minutes: 20
    env:
      DOMINO_TEST_POSTGRES: '1'
      DOMINO_TEST_EVM: '1'
      DOMINO_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache Forge compilation artifacts
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            contracts/cache
            contracts/out
          key: forge-${{ runner.os }}-${{ hashFiles('contracts/**/*.sol', 'contracts/foundry.toml', 'package-lock.json') }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-api.lock
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix app ci --no-audit --no-fund
      - run: python -m pip install -r backend/requirements-api.lock
      # Compile the artifact tree the backend EVM tests load: the DominoSetup
      # test pulls PoolManager, PositionManager, StateView and SetupToken.
      # A whole-tree forge build OOMs soljson; the positional path compiles
      # only this closure (issue #144). This pinned forge has no --match-path
      # on build, so the path is positional, and forge resolves it against
      # the project root: run from contracts/ or the solc import callback
      # receives doubled "contracts/contracts/..." paths.
      - name: Build contract artifacts for backend EVM tests
        working-directory: contracts
        run: node ../scripts/test-contracts.mjs build test/setup/DominoSetup.t.sol
      # The backend EVM tests deploy the whole V4 stack from contracts/out; this
      # suite's closure builds every artifact they load, as the V3 receipt
      # fixture did before V3 was retired.
      - name: Build and qualify the V4 execution fixture
        run: node scripts/test-contracts.mjs --match-path test/reference/OfficialDominoExecutionV4.t.sol
      # The legacy charged-lot receipt case uses an explicitly seeded test vault;
      # no production API can create that historical initial state.
      - name: Build and qualify swap reinvestment and legacy charged balances
        run: node scripts/test-contracts.mjs --match-path test/audit_engine/SwapReinvestment.t.sol
      - name: Build public V1 contracts and prove equivalence to the internal V4 bases
        run: node scripts/build-public-release.mjs
      - name: Independently reproduce the reviewed release artifact manifest
        run: node scripts/release-artifact-manifest.mjs --check
      - run: python scripts/export-read-contract.py --check
      - run: python scripts/export-read-v2-contract.py --check
      - run: python scripts/export-read-v3-contract.py --check
      - run: python scripts/check-read-v3-parity.py
      - run: python scripts/export-read-openapi.py --check
      - run: python scripts/export-session-contract.py --check
      - run: python scripts/export-onboarding-contract.py --check
      - run: python scripts/export-deposit-contract.py --check
      - run: python scripts/export-performance-contract.py --check
      - run: python scripts/export-performance-v2-contract.py --check
      - run: python scripts/export-execution-contract.py --check
      - run: npm run check:read-bridge
      - name: Check PostgreSQL tools
        run: test -x "$DOMINO_PG_BIN/initdb"
      - name: Check staging catalogue inventory in a disposable cluster
        run: |
          DOMINO_TEST_STAGING_POSTGRES=1 python -B -m unittest discover -s scripts/staging/tests -p test_catalogue_postgres.py -v
          DOMINO_TEST_STAGING_POSTGRES=1 python -B -m unittest discover -s scripts/staging/tests -p test_upgrade_postgres.py -v
          DOMINO_TEST_STAGING_POSTGRES=1 python -B -m unittest discover -s scripts/staging/tests -p test_dev_catalogue_profile.py -v
          DOMINO_TEST_STAGING_POSTGRES=1 python -B -m unittest discover -s scripts/staging/tests -p test_upgrade_financial.py -v
      - run: python backend/dev_postgres.py prepare-tests
      - run: python -m unittest discover -s backend/tests -v
      - name: Verify unsigned financial deployment tooling on disposable EVM
        run: node --test scripts/prepare-financial-release.test.mjs scripts/prepare-financial-release-rpc.test.mjs scripts/release-artifact-manifest.test.mjs scripts/build-public-release.test.mjs
      - name: Stop isolated database
        if: always()
        run: python backend/dev_postgres.py stop
  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    # Every .sol change misses the artifact cache, because the key hashes
    # contracts/**/*.sol - so a cold full Forge compilation of the vendored v4
    # reference tree is the normal case here, not the exception. Measured on run
    # 35466837442: about 23 minutes of solc across the per-suite closures, which
    # cancelled a 20-minute job whose every suite had passed. Give headroom so
    # the job is not spuriously cancelled (issue #145).
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Cache Forge compilation artifacts
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            contracts/cache
            contracts/out
          key: forge-${{ runner.os }}-${{ hashFiles('contracts/**/*.sol', 'contracts/foundry.toml', 'package-lock.json') }}
      - run: npm ci --no-audit --no-fund
      # One suite at a time: a single forge invocation compiles every source in
      # one soljson payload and aborts (OOM) on the whole vendored v4 tree, so
      # the job must build each suite's dependency closure separately with a
      # shared Forge cache (issue #145).
      - name: Run the contract suites, one dependency closure at a time
        run: |
          set -e
          for suite in $(find contracts/test -name '*.t.sol' | sort); do
            echo "::group::${suite}"
            node scripts/test-contracts.mjs --match-path "${suite#contracts/}"
            echo "::endgroup::"
          done
      # Deterministic gas per test against the committed baseline; a regression
      # fails here instead of surfacing in a report months later.
      - name: Check the gas baseline
        run: node --test scripts/gas-baseline.test.mjs scripts/mutate-contracts.test.mjs && node scripts/gas-baseline.mjs --check
  preview:
    name: Deploy gated preview
    needs: [hygiene, frontend, frontend_browser, backend, contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-gated-preview
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm --prefix app ci --no-audit --no-fund
      - name: Build and record exactly what will be uploaded
        run: npm --prefix app run release:build
      - name: Deploy that recorded dist to the gated preview
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm --prefix app run deploy:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A repository variable, not a secret: the account id is an
          # identifier that already appears in dashboard URLs and wrangler
          # configs, and hiding it would only cost the owner a step.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Say why nothing was deployed
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Preview not deployed::Set CLOUDFLARE_API_TOKEN as a repository secret under Settings > Secrets and variables > Actions > Secrets."
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Preview not deployed::Set CLOUDFLARE_ACCOUNT_ID as a repository variable under Settings > Secrets and variables > Actions > Variables."
          fi
          echo "This build was recorded but not uploaded. Once configured, a successful main push run deploys the gated preview."
