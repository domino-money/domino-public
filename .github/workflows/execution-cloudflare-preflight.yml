name: Inspect execution Cloudflare path
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit to inspect
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: inspect-execution-cloudflare
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.repository == 'domino-money/domino' && github.event.repository.private == true
    runs-on: [self-hosted, Linux, X64, domino-ci, "domino-ci-${{ github.run_id }}-${{ github.run_attempt }}", domino-ci-deploy, "domino-job-execution-inspect"]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the dispatched main commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Check preflight policy and synthetic responses
        run: node --test scripts/inspect-execution-cloudflare.test.mjs
      - name: Inspect Cloudflare with repository credential
        run: node scripts/inspect-execution-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
